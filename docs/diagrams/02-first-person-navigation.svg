<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Find it. Plan a route. Walk there.</title><desc id="desc">Three target inputs share one navigation loop; manual exploration drives the avatar directly.</desc>
<rect width="1600" height="420" rx="20" fill="#EEEAF1"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#4E43A4"/></marker></defs>
<text x="38" y="41" font-family="sans-serif" font-weight="700" font-size="17" fill="#4E43A4">SITESENSE / SPACEBOTS</text>
<text x="38" y="83" font-family="sans-serif" font-weight="700" font-size="32" fill="#29263E">Find it. Plan a route. Walk there.</text>
<text x="38" y="111" font-family="sans-serif" font-size="17" fill="#615C70">Three target inputs share one navigation loop; manual exploration drives the avatar directly.</text>
<rect x="38.0" y="132" width="279.2" height="205" rx="15" fill="#FFFCFF" stroke="#D8D1DC"/>
<rect x="38.0" y="132" width="279.2" height="8" rx="4" fill="#4E43A4"/>
<text x="56.0" y="172" font-family="sans-serif" font-size="15" fill="#C36B49" font-weight="700">01</text>
<text x="56.0" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">Select a target</text>
<text x="56.0" y="259" font-family="sans-serif" font-size="17" fill="#615C70">Map point / known asset</text>
<text x="56.0" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Or image-query match</text>
<path d="M323.2 233 H341.2" stroke="#4E43A4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
