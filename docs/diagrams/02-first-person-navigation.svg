<text x="1300.8" y="259" font-family="sans-serif" font-size="17" fill="#615C70">RGB + expected depth</text>
<text x="1300.8" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Nearby service context</text>
<text x="38" y="381" font-family="sans-serif" font-size="18" fill="#615C70">Manual controls → avatar pose. Image matching is not automatic physical asset identification.</text>
