<rect x="349.2" y="132" width="279.2" height="8" rx="4" fill="#4E43A4"/>
<text x="367.2" y="172" font-family="sans-serif" font-size="15" fill="#C36B49" font-weight="700">02</text>
<text x="367.2" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">Confirm location</text>
<text x="367.2" y="259" font-family="sans-serif" font-size="17" fill="#615C70">User reviews the match</text>
<text x="367.2" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Synthetic asset records</text>
<path d="M634.4 233 H652.4" stroke="#4E43A4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="660.4" y="132" width="279.2" height="205" rx="15" fill="#FFFCFF" stroke="#D8D1DC"/>
<rect x="660.4" y="132" width="279.2" height="8" rx="4" fill="#4E43A4"/>
<text x="678.4" y="172" font-family="sans-serif" font-size="15" fill="#C36B49" font-weight="700">03</text>
<text x="678.4" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">Plan with A*</text>
<text x="678.4" y="259" font-family="sans-serif" font-size="17" fill="#615C70">Reachable approach point</text>
<text x="678.4" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Avoid occupied cells</text>
<path d="M945.6 233 H963.6" stroke="#4E43A4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="971.6" y="132" width="279.2" height="205" rx="15" fill="#FFFCFF" stroke="#D8D1DC"/>
<rect x="971.6" y="132" width="279.2" height="8" rx="4" fill="#4E43A4"/>
<text x="989.6" y="172" font-family="sans-serif" font-size="15" fill="#C36B49" font-weight="700">04</text>
<text x="989.6" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">First-person avatar</text>
<text x="989.6" y="259" font-family="sans-serif" font-size="17" fill="#615C70">Level view while walking</text>
<text x="989.6" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Face target on arrival</text>
<path d="M1256.8 233 H1274.8" stroke="#4E43A4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
