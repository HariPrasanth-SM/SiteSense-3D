<text x="367.2" y="172" font-family="sans-serif" font-size="15" fill="#C36B49" font-weight="700">02</text>
<text x="367.2" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">FastSAM masks</text>
<text x="367.2" y="259" font-family="sans-serif" font-size="17" fill="#615C70">Keep independent regions</text>
<text x="367.2" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Retain quality decisions</text>
