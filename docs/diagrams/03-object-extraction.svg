<text x="989.6" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">3D region groups</text>
<text x="989.6" y="259" font-family="sans-serif" font-size="17" fill="#615C70">Fuse observed surfaces</text>
<text x="989.6" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Overlaps are permitted</text>
