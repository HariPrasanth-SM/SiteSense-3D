<text x="678.4" y="172" font-family="sans-serif" font-size="15" fill="#C36B49" font-weight="700">03</text>
<text x="678.4" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">DINOv3 + geometry</text>
<text x="678.4" y="259" font-family="sans-serif" font-size="17" fill="#615C70">Visual candidate matching</text>
<text x="678.4" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Cross-view consistency</text>
