<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">From image masks to 3D object regions</title><desc id="desc">Work in progress: larger regions are easier to recover than small industrial components.</desc>
