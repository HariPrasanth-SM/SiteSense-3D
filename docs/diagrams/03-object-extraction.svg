<text x="38" y="41" font-family="sans-serif" font-weight="700" font-size="17" fill="#4E43A4">SITESENSE / SPACEBOTS</text>
<text x="38" y="83" font-family="sans-serif" font-weight="700" font-size="32" fill="#29263E">From image masks to 3D object regions</text>
<text x="38" y="111" font-family="sans-serif" font-size="17" fill="#615C70">Work in progress: larger regions are easier to recover than small industrial components.</text>
<rect x="38.0" y="132" width="279.2" height="205" rx="15" fill="#FFFCFF" stroke="#D8D1DC"/>
<rect x="38.0" y="132" width="279.2" height="8" rx="4" fill="#4E43A4"/>
