<text x="1300.8" y="259" font-family="sans-serif" font-size="17" fill="#615C70">Cleaned point clouds</text>
<text x="1300.8" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Original Gaussian subsets</text>
<text x="38" y="381" font-family="sans-serif" font-size="18" fill="#615C70">Around 115 larger region hypotheses in the development collection. Hidden surfaces and small parts may remain incomplete.</text>
