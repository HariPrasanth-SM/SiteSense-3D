<text x="56.0" y="207" font-family="sans-serif" font-size="22" fill="#29263E" font-weight="700">Calibrated views</text>
<text x="56.0" y="259" font-family="sans-serif" font-size="17" fill="#615C70">RGB, depth and poses</text>
<text x="56.0" y="282" font-family="sans-serif" font-size="17" fill="#615C70">Known camera intrinsics</text>
